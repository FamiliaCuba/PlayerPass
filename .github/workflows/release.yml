# Publish a Windows (NSIS) release + updater artifacts when a v* tag is pushed.
# Requires secrets: TAURI_SIGNING_PRIVATE_KEY (+ optional PASSWORD).
# See docs/RELEASE.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # local.rs is gitignored; the build fails without it.
      # Default: copy the example (placeholders). For "official" builds
      # with real webhook/OAuth, set the optional secrets listed below.
      - name: Prepare secrets/local.rs
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ADMIN_RECOVERY_CODE: ${{ secrets.ADMIN_RECOVERY_CODE }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          $dst = "src-tauri/secrets/local.rs"
          if (-not [string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            $admin = if ($env:ADMIN_RECOVERY_CODE) { $env:ADMIN_RECOVERY_CODE } else { "change-this-admin-code" }
            $invite = if ($env:DISCORD_INVITE_URL) { $env:DISCORD_INVITE_URL } else { "https://discord.gg/YOUR-INVITE" }
            $google = if ($env:GOOGLE_OAUTH_CLIENT_ID) { $env:GOOGLE_OAUTH_CLIENT_ID } else { "REPLACE.apps.googleusercontent.com" }
            $ms = if ($env:MICROSOFT_OAUTH_CLIENT_ID) { $env:MICROSOFT_OAUTH_CLIENT_ID } else { "REPLACE-AZURE-APP-ID" }
            $body = @"
          // Generated in CI — do not commit.
          pub const DISCORD_WEBHOOK_URL: &str = "$($env:DISCORD_WEBHOOK_URL)";
          pub const ADMIN_RECOVERY_CODE: &str = "$admin";
          pub const DISCORD_INVITE_URL: &str = "$invite";
          pub const GOOGLE_OAUTH_CLIENT_ID: &str = "$google";
          pub const MICROSOFT_OAUTH_CLIENT_ID: &str = "$ms";
          "@
            # Strip accidental YAML/heredoc indentation
            $lines = $body -split "`n" | ForEach-Object { $_ -replace '^\s+', '' }
            [System.IO.File]::WriteAllLines((Join-Path $pwd $dst), $lines)
            Write-Host "local.rs generated from GitHub secrets"
          } else {
            Copy-Item src-tauri/secrets/local.example.rs $dst
            Write-Host "local.rs = local.example.rs (placeholders)"
          }

      # Local: createUpdaterArtifacts=false (no private key required).
      # CI: enable only here to sign .sig + produce latest.json.
      - name: Enable createUpdaterArtifacts
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $raw = Get-Content $path -Raw
          if ($raw -notmatch '"createUpdaterArtifacts"\s*:\s*false') {
            throw "createUpdaterArtifacts is not false; aborting to avoid blind signing"
          }
          $raw = $raw -replace '"createUpdaterArtifacts"\s*:\s*false', '"createUpdaterArtifacts": true'
          [System.IO.File]::WriteAllText((Resolve-Path $path), $raw)

      - name: Build + GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PlayerPass ${{ github.ref_name }}
          releaseBody: |
            Windows NSIS installer + updater (`latest.json`).

            SmartScreen may warn if the installer is not Authenticode-signed.
            See `docs/RELEASE.md`.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
